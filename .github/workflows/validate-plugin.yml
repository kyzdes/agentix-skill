# Package validation for the shared Claude Code and Codex Agentix skill.

name: validate-plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Claude plugin.json must be valid and versioned
        run: |
          python3 - <<'PY'
          import json, re, sys, pathlib
          p = pathlib.Path('.claude-plugin/plugin.json')
          if not p.exists():
              sys.exit(f"error: {p} not found")
          try:
              data = json.loads(p.read_text(encoding='utf-8'))
          except json.JSONDecodeError as ex:
              sys.exit(f"error: {p} is not valid JSON: {ex}")
          if not data.get('name'):
              sys.exit(f"error: {p} missing required `name` field")
          version = data.get('version', '')
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              sys.exit(f"error: {p} version must be semantic x.y.z")
          print(f"ok: plugin.json valid (name={data['name']!r}, version={version})")
          PY

      - name: hooks and shell scripts must be valid
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          path = pathlib.Path('hooks/hooks.json')
          try:
              data = json.loads(path.read_text(encoding='utf-8'))
          except (OSError, json.JSONDecodeError) as ex:
              sys.exit(f"error: invalid {path}: {ex}")
          hooks = data.get('hooks', {}).get('SessionStart', [])
          if not hooks:
              sys.exit('error: SessionStart hook missing')
          print('ok: hooks.json valid')
          PY
          bash -n scripts/auto-update.sh
          test -x scripts/auto-update.sh

      - name: update hook is opt-in and debounced
        run: |
          test_root="$(mktemp -d)"
          trap 'rm -rf "$test_root"' EXIT
          mkdir -p "$test_root/bin" "$test_root/claude/plugins" "$test_root/codex-data"
          printf '%s\n' '{"plugins":{"agentix@claude-skills":{},"other@claude-skills":{}}}' > "$test_root/claude/plugins/installed_plugins.json"
          cat > "$test_root/bin/claude" <<'SH'
          #!/usr/bin/env bash
          printf '%s\n' "$*" >> "$AGENTIX_TEST_CALLS_PATH"
          SH
          cat > "$test_root/bin/codex" <<'SH'
          #!/usr/bin/env bash
          printf '%s\n' "$*" >> "$AGENTIX_TEST_CALLS_PATH"
          SH
          chmod +x "$test_root/bin/claude" "$test_root/bin/codex"

          PATH="$test_root/bin:$PATH" \
            AGENTIX_PLUGIN_CACHE_ROOT="$test_root/claude-cache" \
            AGENTIX_PLUGIN_CLAUDE_INSTALL_JSON="$test_root/claude/plugins/installed_plugins.json" \
            AGENTIX_TEST_CALLS_PATH="$test_root/claude-calls" \
            scripts/auto-update.sh
          test ! -e "$test_root/claude-calls"

          PATH="$test_root/bin:$PATH" \
            AGENTIX_PLUGIN_AUTO_UPDATE=1 \
            AGENTIX_PLUGIN_CACHE_ROOT="$test_root/claude-cache" \
            AGENTIX_PLUGIN_CLAUDE_INSTALL_JSON="$test_root/claude/plugins/installed_plugins.json" \
            AGENTIX_TEST_CALLS_PATH="$test_root/claude-calls" \
            scripts/auto-update.sh
          PATH="$test_root/bin:$PATH" \
            AGENTIX_PLUGIN_AUTO_UPDATE=1 \
            AGENTIX_PLUGIN_CACHE_ROOT="$test_root/claude-cache" \
            AGENTIX_PLUGIN_CLAUDE_INSTALL_JSON="$test_root/claude/plugins/installed_plugins.json" \
            AGENTIX_TEST_CALLS_PATH="$test_root/claude-calls" \
            scripts/auto-update.sh
          test "$(wc -l < "$test_root/claude-calls")" -eq 2
          test "$(sed -n '1p' "$test_root/claude-calls")" = "plugin marketplace update claude-skills"
          test "$(sed -n '2p' "$test_root/claude-calls")" = "plugin update agentix@claude-skills"
          ! grep -q 'other@claude-skills' "$test_root/claude-calls"
          test "$(wc -c < "$test_root/claude-cache/update.log")" -le 65536

          PATH="$test_root/bin:$PATH" \
            PLUGIN_DATA="$test_root/codex-data" \
            AGENTIX_PLUGIN_AUTO_UPDATE=1 \
            AGENTIX_TEST_CALLS_PATH="$test_root/codex-calls" \
            scripts/auto-update.sh
          test "$(wc -l < "$test_root/codex-calls")" -eq 2
          test "$(sed -n '1p' "$test_root/codex-calls")" = "plugin marketplace upgrade agentix"
          test "$(sed -n '2p' "$test_root/codex-calls")" = "plugin add agentix@agentix"

      - name: skill frontmatter must be complete and version-aligned
        run: |
          python3 - <<'PY'
          import json, re, sys, pathlib
          fm_re = re.compile(r'^---\n(.*?)\n---\n', re.DOTALL)
          name_re = re.compile(r'^name:\s*\S', re.MULTILINE)
          desc_re = re.compile(r'^description:\s*\S', re.MULTILINE)
          version_re = re.compile(r'^\s+version:\s*["\x27]?([^"\x27\s]+)', re.MULTILINE)
          plugin_version = json.loads(pathlib.Path('.claude-plugin/plugin.json').read_text(encoding='utf-8'))['version']
          skills = list(pathlib.Path('skills').glob('*/SKILL.md')) if pathlib.Path('skills').exists() else []
          if not skills:
              sys.exit("error: no skills/*/SKILL.md found")
          failed = False
          for s in skills:
              text = s.read_text(encoding='utf-8')
              m = fm_re.match(text)
              if not m:
                  print(f"error: {s} missing YAML frontmatter (---\\n...\\n---)")
                  failed = True
                  continue
              fm = m.group(1)
              if not name_re.search(fm):
                  print(f"error: {s} frontmatter missing `name:`")
                  failed = True
              if not desc_re.search(fm):
                  print(f"error: {s} frontmatter missing `description:`")
                  failed = True
              version = version_re.search(fm)
              if not version or version.group(1) != plugin_version:
                  print(f"error: {s} metadata.version must match plugin version {plugin_version}")
                  failed = True
              if not failed:
                  print(f"ok: {s}")
          if failed:
              sys.exit(1)
          PY

      - name: Package instructions must match the committed Agentix contract
        run: python3 scripts/verify-contract.py

      - name: Current and legacy contracts must remain compatible
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Scheduled production contract probe
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          AGENTIX_CONTRACT_MCP_TOKEN: ${{ secrets.AGENTIX_CONTRACT_MCP_TOKEN }}
        run: python3 scripts/verify-contract.py --live
